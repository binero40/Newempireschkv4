<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏰 New Empires Amazon</title>
  <link rel="stylesheet" href="/public/css/neon.css">
</head>
<body>

  <header class="header">
    <h1>NEW EMPIRES AMAZON</h1>
    <p class="subtitle">Real CC Checker · Amazon Pay · Multi-Country</p>
  </header>

  <div class="container">

    <!-- LEFT: Checker -->
    <div class="panel">
      <h2>⚡ Card Checker</h2>

      <label>API Key</label>
      <input type="text" id="apiKey" placeholder="NEA-XXXX-XXXX-XXXX-XXXX">

      <label>Amazon Region & Type</label>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <select id="countrySelect">
          <option value="US">🇺🇸 US</option>
          <option value="MX">🇲🇽 MX</option>
          <option value="IT">🇮🇹 IT</option>
          <option value="FR">🇫🇷 FR</option>
          <option value="SG">🇸🇬 SG</option>
        </select>
        <select id="typeSelect">
          <option value="normal">Normal (Credit/Debit)</option>
          <option value="amazonpay">Amazon Pay</option>
        </select>
      </div>

      <label>Session Cookie (paste full Cookie header)</label>
      <textarea id="cookieInput" placeholder="session-id=...; session-token=...; ubid-main=..."></textarea>

      <label>Cards (one per line: 4532015112345678|12/26|123)</label>
      <textarea id="cardsInput" placeholder="4532015112345678|12/26|123&#10;4556012345678901|08/27|456&#10;5200019876543210|03/26|789" rows="5"></textarea>

      <div class="progress-bar"><div class="fill" style="width:0%"></div></div>

      <button class="btn btn-primary" id="btnCheck">▶ CHECK (max 10)</button>

      <div id="statusBar" style="margin-top:12px; font-family:'JetBrains Mono'; font-size:0.85rem;"></div>
    </div>

    <!-- RIGHT: Generator + Cookies -->
    <div>
      <div class="panel" style="margin-bottom:20px;">
        <h2>🎲 Card Generator</h2>
        <label>BIN (4-6 digits)</label>
        <input type="text" id="genBIN" placeholder="4532">
        <div id="binHint" style="font-size:0.7rem; color:var(--text-dim); margin-bottom:8px;"></div>

        <label>Count (1-50)</label>
        <input type="number" id="genCount" value="5" min="1" max="50">

        <button class="btn btn-magenta btn-sm" id="btnGenCards">⚙ GENERATE</button>

        <label style="margin-top:12px;">Output</label>
        <textarea id="genOutput" readonly rows="6"></textarea>
      </div>

      <div class="panel">
        <h2>🍪 Import Cookie</h2>
        <label>Country</label>
        <select id="importCountry">
          <option value="US">US</option>
          <option value="MX">MX</option>
          <option value="IT">IT</option>
          <option value="FR">FR</option>
          <option value="SG">SG</option>
        </select>
        <label>Cookie value</label>
        <textarea id="cookieImport" placeholder="session-id=...; session-token=..."></textarea>
        <button class="btn btn-primary btn-sm" id="btnImportCookie">📥 IMPORT</button>
      </div>
    </div>

    <!-- BOTTOM: Results -->
    <div class="panel" style="grid-column: span 2;">
      <h2>📊 Results</h2>

      <div style="display:flex; gap:20px; margin-bottom:16px;">
        <div>
          <span class="badge badge-live">LIVE: <span id="liveCount">0</span></span>
          <button class="copy-btn" onclick="downloadLives()">⬇ Download .txt</button>
        </div>
        <div>
          <span class="badge badge-dead">DEAD: <span id="deadCount">0</span></span>
          <button class="copy-btn" onclick="downloadDeads()">⬇ Download .txt</button>
        </div>
      </div>

      <div class="section-live">
        <h3>✅ Alive Cards</h3>
        <div id="liveResults"></div>
      </div>

      <div class="section-dead">
        <h3>❌ Dead Cards</h3>
        <div id="deadResults"></div>
      </div>
    </div>

  </div>

  <script src="/public/js/app.js"></script>
</body>
</html>
